workflow: GitHubFlow/v1
mode: ContinuousDelivery
tag-prefix: '[vV]'
commit-message-incrementing: Enabled
major-version-bump-message: '(?m)^(?:[a-z]+(?:\([^\r\n)]+\))?!:|BREAKING[ -]CHANGE:)'
minor-version-bump-message: '(?m)^feat(?:\([^\r\n)]+\))?:'
patch-version-bump-message: '(?m)^(?:fix|perf|refactor|build|revert)(?:\([^\r\n)]+\))?:'
no-bump-message: '(?m)^(?:docs|style|test|ci|chore)(?:\([^\r\n)]+\))?:'
branches:
  main:
    label: ''
    increment: None
  feature:
    regex: '^(?:feat|features?)[/-](?<BranchName>.+)'
    label: preview
    increment: Minor
  pull-request:
    label: preview
